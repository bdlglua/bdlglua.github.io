name: Publish BDLMiner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: website
      - uses: actions/checkout@v7
        with:
          repository: bdlglua/BDLMinerV2
          ref: main
          path: source
      - uses: actions/checkout@v7
        with:
          repository: bdlglua/BDLMiner-stats
          ref: main
          path: collector
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the stable and beta USB installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 source/tools/make_channels.py --repository bdlglua/BDLMinerV2 --output site
      - name: Build the standalone private viewer at /remote/
        run: node collector/scripts/build-remote-site.js site/remote
      - name: Preserve the BDLXS website
        run: |
          cp -R website/bdlxs site/bdlxs
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for any branch-based Pages build before publishing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={os.environ['GITHUB_SHA']}"
          for attempt in range(60):
              runs = json.loads(subprocess.check_output(['gh', 'api', endpoint]))['workflow_runs']
              active = [run for run in runs if run['name'] == 'pages build and deployment' and run['status'] != 'completed']
              if not active:
                  break
              print('Waiting for the existing branch-based Pages workflow...', flush=True)
              time.sleep(5)
          else:
              raise TimeoutError('The branch-based Pages workflow has not finished')
          PY
      - uses: actions/deploy-pages@v5
        id: deploy
      - name: Verify the separate pages, both channels and BDLXS
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          pages = {'home': 'index.html', 'start': 'start.html', 'boards': 'boards.html',
                   'flash': 'flash.html', 'demo': 'demo.html', 'faq': 'faq.html',
                   'releases': 'releases.html', 'stats': 'stats.html',
                   'gallery': 'gallery.html', 'support': 'support.html'}
          def read(path):
              request = Request(base + path, headers={'Cache-Control': 'no-cache'})
              with urlopen(request, timeout=30) as response:
                  assert response.url.startswith(base)
                  return response.read().decode()
          for attempt in range(30):
              try:
                  for prefix in ('', 'beta/'):
                      page = read(prefix)
                      assert '<title>BDLMiner V2:' in page
                      assert 'http-equiv="refresh"' not in page
                      content = json.loads(re.search(r'<script id="site-data" type="application/json">(.*?)</script>', page, re.S)[1])
                      assert content['channel'] == ('beta' if prefix else 'stable')
                      assert content['page'] == 'home'
                      assert content['boards'] and any(content['support'].values())
                      assert content['pool_names']['public-pool.io'] == 'Public Pool'
                      assert content['pool_links']['public-pool.io'] == 'https://web.public-pool.io/'
                      main = re.search(r'<main[^>]*>(.*?)</main>', page, re.S)[1]
                      for component in ('board-comparison', 'discovery-demo', 'discovery-help', 'discovery-support'):
                          assert f'id="{component}"' not in main
                      assert 'href="flash.html" data-t="ctaInstall">Install</a>' in page
                      assert 'Install in 2 minutes' not in page and 'Installer en 2 minutes' not in page
                      for key, path in pages.items():
                          document = page if key == 'home' else read(prefix + path)
                          assert f'data-page="{key}"' in document
                          data = json.loads(re.search(r'<script id="site-data" type="application/json">(.*?)</script>', document, re.S)[1])
                          assert data['page'] == key and data['channel'] == content['channel']
                          assert data['version'] == content['version']
                          assert '__PAGE_' not in document
                          assert 'href="remote.html"' in document
                          assert ('src="https://unpkg.com/esp-web-tools' in document) == (key == 'flash')
                          if key == 'stats':
                              assert 'id="st-pools"' in document
                              assert 'id="st-coins"' in document
                              assert 'data-t="poolsHelp"' not in document
                              # The pool table is filled by the shared site script.
                              script = read(prefix + 'assets/site.js')
                              assert 'poolUnknown' in script and 'poolOther' in script
                              assert 'pool-site' in script and 'noopener noreferrer' in script
                      assert 'Support BDLMiner' in read(prefix + 'assets/discovery.js')
                      agent_settings = read(prefix + 'demo/miner/settings.js')
                      assert 'user_agents' in agent_settings and 'CHOICES.ua=agents.map' in agent_settings
                      assert 'Bitcoin SV (BSV)' in agent_settings and 'eCash (XEC)' in agent_settings
                      assert 'DigiByte · SHA-256d (DGB)' in agent_settings
                      assert 'remotekey' in agent_settings and 'Private remote monitoring' in agent_settings
                      assert 'https://miner.bdl-pool.com/remote.html' in agent_settings
                      assert 'Manual user agent' not in agent_settings and "uaauto:[['true','Automatic']" not in agent_settings
                      for mode in ('miner', 'hub'):
                          demo = read(prefix + 'demo/' + mode + '/index.html')
                          assert 'Content-Security-Policy' in demo and 'connect-src' in demo
                          assert 'BDL_DEMO' in demo
                      manifest = json.loads(read(prefix + 'manifest-m5stickc-plus2.json'))
                      assert manifest['name'].startswith('BDLMiner V2')
                      assert manifest['version'] == content['version']
                  assert 'NovaFlow' in read('bdlxs/')
                  assert 'BDLXS' in read('bdlxs/')
                  remote = read('remote/')
                  assert 'id="login-form"' in remote
                  assert re.search(r'href="\./remote\.css(\?v=[a-f0-9]+)?"', remote) and re.search(r'src="\./remote\.js(\?v=[a-f0-9]+)?"', remote)
                  api = 'https://api.bdl-pool.com:36018'
                  assert 'name="bdl-remote-api" content="' + api + '"' in remote
                  assert 'connect-src ' + api in remote and 'name="referrer" content="no-referrer"' in remote
                  private_build = json.loads(read('remote/build.json'))
                  assert private_build['api_origin'] == api
                  assert re.fullmatch('[a-f0-9]{40}', private_build['source_commit'])
                  for asset, digest in private_build['sha256'].items():
                      assert asset in ('index.html', 'remote.js', 'remote.css')
                      assert hashlib.sha256(read('remote/' + asset).encode()).hexdigest() == digest
                  origin = urlsplit(base).scheme + '://' + urlsplit(base).netloc
                  preflight = Request(api + '/api/remote', headers={'User-Agent':'BDLMiner-site-check/2.3.0',
                      'Origin':origin, 'Access-Control-Request-Method':'GET',
                      'Access-Control-Request-Headers':'authorization'}, method='OPTIONS')
                  with urlopen(preflight, timeout=20) as response:
                      assert response.status == 204 and response.headers['Access-Control-Allow-Origin'] == origin
                  guarded = Request(api + '/api/remote', headers={'User-Agent':'BDLMiner-site-check/2.3.0','Origin':origin})
                  try:
                      urlopen(guarded, timeout=20)
                      raise AssertionError('Private readings did not require a key')
                  except HTTPError as error:
                      assert error.code == 401 and error.headers['Access-Control-Allow-Origin'] == origin
                  print('PASS: standalone /remote/ page, verified static assets, GitHub-origin preflight and private API key requirement')
                  print('PASS: all 20 separate pages, Flash action, pool statistics, isolated demos, USB manifests and original BDLXS page')
                  break
              except Exception as error:
                  if attempt == 29:
                      raise
                  print('Waiting for Pages propagation:', type(error).__name__, flush=True)
                  time.sleep(5)
          PY
